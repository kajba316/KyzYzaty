<!doctype html>
<html lang="ky">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Той Чакыруу</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Marck+Script&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ambient falling petals (persists across both screens) -->
<div id="petalsLayer"></div>

<!-- ============================================================
     INTRO SCREEN — сүттөй ак фон, тан-алтын эмблема (видеодогудай)
============================================================= -->
<div id="envelopeScreen">
  <div class="envcorner envcorner--tl"><img src="img/sprig-a.png" alt=""/></div>
  <div class="envcorner envcorner--tr"><img src="img/sprig-c.png" alt=""/></div>
  <div class="envcorner envcorner--bl"><img src="img/sprig-d.png" alt=""/></div>
  <div class="envcorner envcorner--br"><img src="img/sprig-b.png" alt=""/></div>

  <div class="envelope-wrap" id="envelopeWrap">
    <button id="waxSeal" aria-label="Ачуу үчүн басыңыз">
      <span class="seal-glow"></span>
      <span class="seal-disc">
        <img src="img/ornament-mandala.png" alt="" class="emblem-img"/>
        <span class="seal-mono" id="sealMono">Т&amp;Г</span>
      </span>
      <p class="seal-hint">Ачуу үчүн басыңыз</p>
    </button>
  </div>
</div>

<div class="light-burst" id="lightBurst"></div>

<!-- ============================================================
     MAIN INVITATION
============================================================= -->
<div id="mainInvitation" class="hidden">

  <button id="musicBtnFloat" class="music-btn music-btn--float" title="Музыка">
    <svg viewBox="0 0 24 24" fill="none">
      <rect class="bar" x="4"  y="10" width="2.6" height="10" rx="1.3" fill="currentColor" style="animation-delay:0s"/>
      <rect class="bar" x="10.7" y="6" width="2.6" height="14" rx="1.3" fill="currentColor" style="animation-delay:.2s"/>
      <rect class="bar" x="17.4" y="9" width="2.6" height="11" rx="1.3" fill="currentColor" style="animation-delay:.4s"/>
    </svg>
  </button>

  <div class="page-wrapper">
    <div class="invitation-card">

      <div class="ribbon-band"><img src="img/border-2.png" alt=""/></div>

      <span class="sprig sprig--tl reveal"><img src="img/sprig-a.png" alt=""/></span>
      <span class="sprig sprig--tr reveal"><img src="img/sprig-c.png" alt=""/></span>

      <!-- hero photo with names/date baked into the fade, like the video -->
      <div class="hero-photo">
        <img id="heroImg" class="hero-img" alt="Той сүрөтү" />
        <div class="hero-overlay"></div>
        <div class="hero-text">
          <p class="hero-names" id="heroNames"></p>
          <p class="hero-type" id="heroType"></p>
          <p class="hero-date" id="heroDate"></p>
        </div>
      </div>

      <!-- greeting — видеодогудай кутусуз, түз ортодо; эмблема текст менен чогуу пайда болот -->
      <section class="greeting-section reveal">
        <div class="emblem-divider"><img src="img/ornament-mandala.png" class="emblem-icon" alt=""/></div>
        <p class="greeting-text" id="greetingLines"></p>
        <p class="greeting-name" id="greetingName"></p>
        <p class="greeting-body" id="greetingBody"></p>
      </section>

      <!-- countdown (кошумча функция) -->
      <section class="countdown-section reveal">
        <div class="emblem-divider" style="padding-top:0;"><img src="img/ornament-mandala.png" class="emblem-icon" alt=""/></div>
        <p class="countdown-title">Тойго калды</p>
        <div class="countdown-grid">
          <div class="countdown-cell"><div class="countdown-num" id="cdDays">00</div><div class="countdown-unit">күн</div></div>
          <div class="countdown-cell"><div class="countdown-num" id="cdHours">00</div><div class="countdown-unit">саат</div></div>
          <div class="countdown-cell"><div class="countdown-num" id="cdMin">00</div><div class="countdown-unit">мүнөт</div></div>
          <div class="countdown-cell"><div class="countdown-num" id="cdSec">00</div><div class="countdown-unit">секунд</div></div>
        </div>
      </section>

      <div class="mid-photo-wrap reveal">
        <img id="midImg" class="mid-photo" alt="Келин" />
      </div>

      <!-- calendar: "Той салтанаты:" -->
      <section class="calendar-section reveal">
        <div class="emblem-divider"><img src="img/ornament-mandala.png" class="emblem-icon" alt=""/></div>
        <p class="calendar-title">Той салтанаты:</p>
        <p class="calendar-sub" id="calendarSub"></p>
        <div class="calendar-grid" id="calendarGrid"></div>
      </section>

      <!-- mauve blocks: venue + hosts, so'zsiz видеодогудай -->
      <div class="mauve-block reveal">
        <p class="block-script">Мекен-жайымыз:</p>
        <p class="block-quote" id="venueHall"></p>
        <p class="block-caps" id="venueCity"></p>
        <p class="block-caps" id="venueStreet"></p>
        <div class="map-embed">
          <iframe id="mapFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Той залынын картасы"></iframe>
        </div>
        <a class="map-link" id="mapLink" target="_blank" rel="noopener noreferrer">Картаны ачуу ↗</a>
      </div>

      <div class="mauve-block reveal" style="padding-top:26px;">
        <p class="block-script">Той ээлери:</p>
        <p class="block-caps" id="hostsNames" style="font-size:1.15rem;letter-spacing:.16em;"></p>
      </div>

      <!-- blessing over a big emblem watermark, like the video's closing frame -->
      <section class="blessing-section reveal">
        <img src="img/ornament-mandala.png" class="emblem-icon emblem-icon--big blessing-emblem" alt=""/>
        <p class="blessing-text" id="blessingText"></p>
      </section>

      <div class="bottom-photo-wrap reveal">
        <img id="bottomImg" class="bottom-photo" alt="Той" />
        <div class="bottom-photo-overlay">
          <p class="bottom-photo-text script">Бакыт жана берекет менен!</p>
        </div>
      </div>

      <!-- gallery -->
      <section class="gallery-section reveal">
        <p class="detail-label" style="text-align:center;margin-bottom:12px;">Сүрөттөр</p>
        <div class="gallery-grid" id="galleryGrid"></div>
      </section>

      <!-- RSVP -->
      <section class="rsvp-section reveal">
        <p class="rsvp-title">Келериңизди ырастаңыз</p>
        <p class="rsvp-sub">Бир баскыч менен WhatsApp аркылуу билдирүү жиберип коюңуз</p>
        <a class="rsvp-btn" id="rsvpBtn" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.07L2 22l5.07-1.33A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.62-1.27 1.19-1.75 1.24-.45.05-.9.24-3.02-.63-2.56-1.06-4.2-3.66-4.33-3.83-.13-.17-1.04-1.38-1.04-2.64 0-1.25.66-1.87.9-2.13.22-.24.5-.3.66-.3.17 0 .34 0 .48.01.15.01.36-.06.56.43.22.53.75 1.83.82 1.96.07.13.11.29.02.46-.09.17-.14.28-.27.43-.13.15-.28.34-.4.46-.13.13-.27.27-.12.53.15.26.68 1.12 1.46 1.82 1 .89 1.85 1.16 2.11 1.29.26.13.41.11.56-.07.15-.17.65-.75.82-1.01.17-.26.34-.21.56-.13.22.09 1.42.67 1.66.79.24.13.4.19.46.3.06.11.06.62-.16 1.24z"/></svg>
          Ырастоо
        </a>
      </section>

      <!-- contact -->
      <section class="contact-section reveal">
        <div class="emblem-divider" style="padding-top:0;"><img src="img/ornament-mandala.png" class="emblem-icon" style="width:40px;height:40px;" alt=""/></div>
        <p class="contact-label">Байланыш</p>
        <p class="contact-phone"><a id="contactPhoneLink" href="#"></a></p>
        <p class="contact-instagram"><a id="contactInstagram" href="#" target="_blank" rel="noopener noreferrer"></a></p>
        <div class="contact-icons">
          <a id="waLink" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" title="WhatsApp">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.07L2 22l5.07-1.33A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
          </a>
          <a id="contactPhoneIcon" href="#" aria-label="Чалуу" title="Чалуу">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1.1.5 1.1 1.1V20c0 .6-.5 1.1-1.1 1.1C10.6 21.1 2.9 13.4 2.9 3.1 2.9 2.5 3.4 2 4 2h3.3c.6 0 1.1.5 1.1 1.1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1L6.6 10.8Z"/></svg>
          </a>
        </div>
      </section>

      <span class="sprig sprig--bl reveal"><img src="img/sprig-d.png" alt=""/></span>
      <span class="sprig sprig--br reveal"><img src="img/sprig-b.png" alt=""/></span>

      <div class="ribbon-band ribbon-band--flip"><img src="img/border-6.png" alt=""/></div>

      <footer class="card-footer">
        <p class="footer-blessing">Бакытка толгон тойдо кездешели!</p>
      </footer>

    </div>
  </div>
</div>

<!-- lightbox -->
<div id="lightboxOverlay">
  <button class="lightbox-close" id="lightboxClose" aria-label="Жабуу">&times;</button>
  <img id="lightboxImg" src="" alt="Той сүрөтү" />
</div>

<audio id="bgAudio" loop preload="none">
  <!-- Add your own royalty-free track: create a "music" folder and point to it below -->
  <source src="music/background.mp3" type="audio/mpeg" />
</audio>

<script src="script.js"></script>
</body>
</html>
